[project]
name = "gallica-mcp-server"
version = "0.1.0"
description = "Serveur MCP pour interroger Gallica (BnF) : recherche SRU, métadonnées, OCR/ContentSearch, IIIF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aurélien Michon" }]
keywords = ["mcp", "gallica", "bnf", "iiif", "sru", "genealogy"]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
gallica-mcp-server = "gallica_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gallica_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
